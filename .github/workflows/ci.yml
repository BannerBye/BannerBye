name: CI — typecheck, TCF verify, build

# Draait bij elke push en PR. Drie poorten:
#  1. tsc --noEmit
#  2. tcf:verify — decodeert onze no-consent TC-string met de officiële
#     IAB Tech Lab-bibliotheek (@iabtechlabtcf/core) en controleert elk
#     veld. Dit is de belofte op bannerbye.com/tcf-check ("every build is
#     checked against the IAB Tech Lab reference library before it ships").
#  3. wxt build voor de drie targets.
# Geen secrets, geen deploy — alleen rood/groen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Geen `version:` hier — de action leest `packageManager` uit package.json
      # en weigert ("Multiple versions of pnpm specified") als beide gezet zijn.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: TCF string against the IAB reference decoder
        run: pnpm tcf:verify

      - name: Build all targets
        run: pnpm build:all

  refuse:
    # packages/refuse — de motor als bibliotheek + MCP-server. Eigen lockfile.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/refuse
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build (esbuild) + declarations
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Chromium for the fixture tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Fixture tests
        run: pnpm test
