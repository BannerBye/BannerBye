name: Phase 2B/2C — analyze reported sites

# Pijplijn v2 (0.4.17, 9 nov 2026). Headless analyse van gemelde sites in
# meerdere profielen (zoals de melder + desktop), met de snapshot van de
# melder als tweede bewijsbron; Claude beoordeelt elk voorstel.
#
# Wat er automatisch live gaat en wat niet:
#   - approve/high → HOST-SCOPED (autoclick.hostRules[host]) direct op main.
#     Bewuste, afgebakende uitzondering op security-fix #1 (2026-09-16): de
#     blast radius is één host. Zie scripts/phase2b/apply-host-rules.ts.
#   - approve/medium|low en globale kandidaten → één review-PR, nooit auto-merge.
#   - niets gezien → wachtrij (bb:retry), elke 6 uur opnieuw, max 3 pogingen.
#
# Triggers: repository_dispatch bij elke geldige melding (api/report.ts),
# een 6-uurs schema voor de wachtrij (RETRY_MODE=1), en workflow_dispatch.
on:
  repository_dispatch:
    types: [report-submitted]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      max_hosts:
        description: "Max aantal hosts deze run"
        required: false
        default: "25"
      retry_mode:
        description: "Alleen de wachtrij (herhaalpogingen) draaien"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase2b-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extensie-repo (analyzer + keyword-logica)
        uses: actions/checkout@v5

      - name: Checkout landing-repo (bannerbye.com bron)
        uses: actions/checkout@v5
        with:
          repository: BannerBye/bannerbye-landing
          token: ${{ secrets.LANDING_REPO_TOKEN }}
          path: landing

      # setup-node@v5 wil via package-manager-cache Corepack/pnpm activeren (root
      # packageManager-veld pnpm@9.12.0) en crasht omdat pnpm niet op de runner
      # staat. De analyzer gebruikt alleen npm → cache uit, dan draait v5 (node24)
      # schoon en verdwijnt de node20-deprecation-warning.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install analyzer deps
        working-directory: scripts/phase2b
        run: npm install --no-audit --no-fund

      # De GitHub-runner heeft af en toe een kapotte Microsoft/Azure apt-repo
      # ("InRelease no longer signed / NOSPLIT") waardoor `--with-deps` (die
      # apt-get draait) faalt. Playwright heeft die repo's niet nodig. We
      # verwijderen ELK bronbestand dat naar packages.microsoft.com verwijst
      # (zowel oude .list- als nieuwe .sources-bestanden), en als apt dan nog
      # struikelt valt de install terug op alleen de browser-binary.
      - name: Install Playwright Chromium
        working-directory: scripts/phase2b
        run: |
          grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
            | xargs -0 -r sudo rm -f || true
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run analyzer (analyse + Claude-judge)
        id: analyze
        working-directory: scripts/phase2b
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opt-in "email me when fixed" (#reward-3). Ontbreekt de secret, dan is
          # notify een stille no-op — de rest van de run draait gewoon door.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAX_HOSTS: ${{ github.event.inputs.max_hosts || '25' }}
          RULES_FILE: ${{ github.workspace }}/landing/rules.json
          # Schema-run = alleen de wachtrij; dispatch = nieuwe meldingen.
          RETRY_MODE: ${{ (github.event_name == 'schedule' || github.event.inputs.retry_mode == 'true') && '1' || '0' }}
        run: node --experimental-strip-types analyze.ts

      # Pijplijn v2: host-scoped fixes met hoge zekerheid direct naar main.
      # Alleen autoclick.hostRules[host] verandert; globale lijsten nooit hier.
      - name: Host-regels toepassen (approve/high, blast radius één host)
        if: steps.analyze.outputs.has_hostrules == 'true'
        working-directory: scripts/phase2b
        env:
          RULES_FILE: ${{ github.workspace }}/landing/rules.json
        run: node --experimental-strip-types apply-host-rules.ts

      - name: Host-regels committen en pushen naar landing main
        if: steps.analyze.outputs.has_hostrules == 'true'
        working-directory: landing
        env:
          MSG: ${{ steps.analyze.outputs.hostrules_commit_message }}
        run: |
          git config user.name "bannerbye-pipeline"
          git config user.email "hello@bannerbye.com"
          if git diff --quiet -- rules.json; then
            echo "rules.json ongewijzigd (regels stonden er al)."
          else
            git add rules.json
            git commit -m "$MSG"
            git push origin HEAD:main
          fi

      # Pas ná een geslaagde push: /fixed, ticketstatus en opt-in-mails.
      - name: Publiceer automatisch opgeloste hosts (/fixed + tickets)
        if: steps.analyze.outputs.has_hostrules == 'true'
        working-directory: scripts/phase2b
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node --experimental-strip-types publish-autofixed.ts

      # Globale keywords (lagere zekerheid + host-keywords die op ≥2 hosts
      # voorkomen) blijven via één PR gaan die Robin zelf merget.
      - name: Stage beoordeelde keywords (ready-to-merge + needs-extra-review)
        if: steps.analyze.outputs.has_proposals == 'true'
        working-directory: scripts/phase2b
        env:
          RULES_FILE: ${{ github.workspace }}/landing/rules.json
        run: node --experimental-strip-types apply-needs-review.ts

      - name: PR voor beoordeelde keywords (nooit auto-merge)
        if: steps.analyze.outputs.has_proposals == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: landing
          token: ${{ secrets.LANDING_REPO_TOKEN }}
          branch: phase2c/keyword-review
          base: main
          draft: ${{ steps.analyze.outputs.pr_draft }}
          add-paths: rules.json
          commit-message: ${{ steps.analyze.outputs.commit_message }}
          title: "Pijplijn v2 — keywords naar review"
          body: ${{ steps.analyze.outputs.pr_body }}
          labels: phase-2c, automated, needs-review
